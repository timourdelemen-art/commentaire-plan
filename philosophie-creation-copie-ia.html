<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Création de copie philosophique IA</title>
<link rel="stylesheet" href="styles.css">
<style>
body.creation-page{min-height:100vh;margin:0;background:linear-gradient(rgba(0,0,20,.35),rgba(0,0,20,.75)),url('/images/creation-copie-officielle.webp.png') center/cover fixed;color:white}
.creation-overlay{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.generate-card{width:min(850px,90%);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);padding:35px;border-radius:30px}
.subject-box{width:100%;min-height:220px;font-size:1.3rem;padding:20px;border-radius:20px}
button{margin-top:20px;padding:15px 35px;border-radius:30px}
#resultat{white-space:pre-wrap;background:white;color:#111;padding:20px;border-radius:20px}
</style>
</head>
<body class="creation-page">
<main class="creation-overlay">
<h1>Créer une copie philosophique guidée</h1>
<p>Entrez votre sujet et laissez le moteur construire la dissertation.</p>
<section class="generate-card">
<label for="sujet">Votre sujet philosophique</label>
<textarea id="sujet" class="subject-box" placeholder="Exemple : Peut-on être libre sans être responsable ?"></textarea>
<button id="generer">Créer la copie</button>
<pre id="resultat"></pre>
</section>
</main>
<script>
const ENDPOINT="https://atelier-commentaire-ia.timour-delemen.workers.dev/api/generate-dissertation";
document.getElementById('generer').onclick=async()=>{const sujet=document.getElementById('sujet').value.trim();const out=document.getElementById('resultat');if(!sujet){out.textContent='Veuillez saisir un sujet.';return;}out.textContent='Génération en cours...';try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sujet})});const d=await r.json();out.textContent=d.ok&&d.copie?d.copie:(d.error||'Erreur')}catch(e){out.textContent=e.message}};
</script>
</body>
</html>
