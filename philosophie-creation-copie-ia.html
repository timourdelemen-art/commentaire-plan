<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Création de copie philosophique IA</title>
<link rel="stylesheet" href="styles.css">
<style>
.creation-hero{max-width:1100px;margin:auto;text-align:center;padding:30px}
.creation-hero img{width:100%;max-height:620px;object-fit:cover;border-radius:24px;box-shadow:0 20px 60px #0003}
.philo-entry{display:flex;align-items:center;justify-content:center;gap:35px;margin:35px auto;max-width:1200px}
.philo-name{font-size:2rem;font-weight:700;animation:blink 2s infinite alternate}
.nietzsche{color:#b00020}.freud{color:#0057b8;animation-delay:1s}
@keyframes blink{0%{opacity:.35;filter:brightness(1)}50%{opacity:1;filter:brightness(1.7)}100%{opacity:.45;filter:brightness(.9)}}
.subject-box{max-width:800px;width:100%;font-size:1.3rem;padding:25px;border-radius:20px;min-height:180px;border:2px solid #888}
.generate-card{max-width:1000px;margin:auto;padding:35px}
</style>
</head>
<body>
<main class="wrap">
<section class="creation-hero">
<img src="/images/creation-copie-hero.png" alt="Entrée symbolique de création de copie philosophique">
<h1>Créer une copie philosophique guidée</h1>
<p>Entrez votre sujet : le moteur construit progressivement la dissertation.</p>
</section>
<section class="philo-entry">
<div class="philo-name nietzsche">Nietzsche</div>
<div class="generate-card">
<label for="sujet">Votre sujet philosophique</label>
<textarea class="subject-box" id="sujet" placeholder="Exemple : Peut-on être libre sans être responsable ?"></textarea>
</div>
<div class="philo-name freud">Freud</div>
</section>
<section class="card">
<p><a href="philosophie-choisir-resolution.html">S’entraîner à choisir la meilleure troisième partie →</a></p>
<button id="generer">Créer la copie</button>
<pre id="resultat"></pre>
<div id="audit" aria-live="polite"></div>
</section>
</main>
<script>
const ENDPOINT="https://atelier-commentaire-ia.timour-delemen.workers.dev/api/generate-dissertation";
const btn=document.getElementById('generer');
const out=document.getElementById('resultat');
const audit=document.getElementById('audit');
btn.addEventListener('click',async()=>{
 const sujet=document.getElementById('sujet').value.trim();
 if(!sujet){out.textContent='Veuillez saisir un sujet.';return;}
 out.textContent='Génération en cours...';
 audit.textContent='';
 try{
 const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sujet})});
 const data=await r.json();
 out.textContent=data.ok&&typeof data.copie==='string'?data.copie:(data.error||'La génération a échoué.');
 }catch(e){out.textContent='Erreur : '+e.message;}
});
</script>
</body>
</html>
