[build]
  command = "node scripts/seo-build.js && node scripts/seo-audit.js && node scripts/performance-budget.js"
  publish = "."

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
