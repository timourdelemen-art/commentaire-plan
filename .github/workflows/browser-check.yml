name: Contrôle navigateur et parcours
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôler les banques intégrées
        run: |
          node scripts/test-copies20.js
          node scripts/test-hlp-parcours.js
          node scripts/test-explication-textes.js
          node scripts/test-philo-scenes.js
          node scripts/test-brevet-lecture.js
          python3 -B scripts/test-brevet-reecriture.py
          node scripts/test-philo-banque.js
          (cd scripts/exemples && python -m unittest -q test_verifier)
      - name: Installer Chromium et Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Générer les pages dans une copie jetable
        run: |
          B=$(mktemp -d)
          echo "BUILD_DIR=$B" >> "$GITHUB_ENV"
          git ls-files -co --exclude-standard | tar -cf - -T - | tar -xf - -C "$B"
          cd "$B"
          eval "$(sed -n 's/^ *command = "\(.*\)"/\1/p' netlify.toml)"
      - name: Contrôler les pages à 390, 768 et 1280 pixels
        run: |
          node scripts/check-browser-pages.cjs "$BUILD_DIR"
          node scripts/check-browser-hlp.cjs "$BUILD_DIR"
          node scripts/check-browser-parcours.cjs "$BUILD_DIR"
          node scripts/check-browser-navigation-etudes.cjs "$BUILD_DIR"
          node scripts/check-browser-consignes.cjs "$BUILD_DIR"
          node scripts/check-browser-brevet-redaction.cjs "$BUILD_DIR"
          node scripts/check-browser-brevet-exercices.cjs "$BUILD_DIR"
          node scripts/check-browser-annales-direct.cjs "$BUILD_DIR"
          node scripts/check-browser-micro.cjs "$BUILD_DIR"
          node scripts/check-browser-philo-banque.cjs "$BUILD_DIR"
          PHILO_SCREENSHOT_DIR="$BUILD_DIR/browser-audit" node scripts/check-browser-explication.cjs "$BUILD_DIR"
      - name: Archiver le contrôle visuel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigateur-integration
          path: ${{ env.BUILD_DIR }}/browser-audit
          retention-days: 14
