name: SEO technical audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build HLP annales
        run: node scripts/build-hlp.js
      - name: Vérifier les sources et les liens HLP
        run: node scripts/check-hlp-sources.js
      - name: Build SEO layer
        run: node scripts/seo-build.js
      - name: Audit internal SEO
        run: node scripts/seo-audit.js
      - name: Enforce performance budget
        run: node scripts/performance-budget.js
      - name: Build SEO Brain report
        run: node scripts/seo-brain.js
      - name: Build Bac observatory data
        run: node scripts/observatoire-bac.js
      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-reports
          path: |
            seo-report.md
            seo-brain-report.md
            seo-brain.json
            performance-report.md
            observatoire-bac-report.md
            data/observatoire-bac.json
