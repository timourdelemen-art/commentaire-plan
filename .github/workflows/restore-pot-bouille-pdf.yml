name: Restore Pot-Bouille PDF

on:
  push:
    paths:
      - '.github/workflows/restore-pot-bouille-pdf.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild PDF from repository history
        run: |
          : > /tmp/sequence-pot-bouille.b64
          for p in 00 01 02 03; do
            git show 7faeeac0e0ce2273e0789fd24b33153011f1c471:.pdfparts/part-$p >> /tmp/sequence-pot-bouille.b64
          done
          base64 -d /tmp/sequence-pot-bouille.b64 > sequence-pot-bouille.pdf
          test -s sequence-pot-bouille.pdf
          file sequence-pot-bouille.pdf
      - name: Publish and clean helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/restore-pot-bouille-pdf.yml
          git add sequence-pot-bouille.pdf .github/workflows/restore-pot-bouille-pdf.yml
          git commit -m "Publier le PDF complet Pot-Bouille"
          git push
