name: Audit pédagogique
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier l’ontologie et les réponses libres
        run: node scripts/audit-annales.js
      - name: Tester le moteur déployé
        run: node scripts/test-live-feedback.mjs
