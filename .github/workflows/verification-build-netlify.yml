name: Vérifier le build complet avant Netlify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construire toutes les pages et vérifier les 26 copies
        run: |
          node scripts/build-hlp.js
          node scripts/build-explication-textes.js
          node scripts/build-philo-annales.js
          node scripts/build-philo-notions.js
          node scripts/build-dissertations-v16-pages.js
          node scripts/check-v16-publication.js
          node scripts/build-philo-boussole.js
          node scripts/build-philo-matrices.js
          node scripts/build-bac-annales.js
          node scripts/build-capture.js
          node scripts/build-typo.js
          node scripts/seo-build.js
          node scripts/check-dissertations-exercices.js
          node scripts/check-philo-parcours.js
          node scripts/check-global-pages.js
          node scripts/seo-audit.js
          node scripts/performance-budget.js
          node scripts/clean-publish.js
