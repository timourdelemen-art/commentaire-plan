name: Copier les PDF des sujets HLP
# Lancement manuel (onglet Actions) : télécharge les PDF des sujets HLP dans annales/hlp/,
# régénère les pages HLP pour qu'elles pointent vers ces copies, puis publie sur main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Télécharger les PDF
        run: node scripts/telecharger-pdf-hlp.mjs
      - name: Régénérer les pages HLP
        run: node scripts/build-hlp.js
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add annales/hlp hlp-*.html
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "HLP : copies locales des PDF des sujets"
          git push
