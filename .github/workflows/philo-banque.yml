name: Banque philosophique — contrôles
on:
  pull_request:
    branches: [main]
    paths:
      - 'philosophie-banque*'
      - 'scripts/*philo-banque*'
      - '.github/workflows/philo-banque.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bank:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la banque et son sélecteur
        run: |
          node scripts/build-philo-banque.js --check
          node scripts/test-philo-banque.js
      - name: Installer le navigateur de contrôle
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Construire et parcourir la banque
        run: |
          B=$(mktemp -d)
          git ls-files -co --exclude-standard | tar -cf - -T - | tar -xf - -C "$B"
          cd "$B"
          eval "$(sed -n 's/^ *command = "\(.*\)"/\1/p' netlify.toml)"
          cd "$GITHUB_WORKSPACE"
          node scripts/check-browser-philo-banque.cjs "$B"
