name: Publish Pot-Bouille PDF

on:
  push:
    paths:
      - '.pdfparts/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild PDF
        run: |
          cat .pdfparts/part-* > /tmp/sequence-pot-bouille.b64
          base64 -d /tmp/sequence-pot-bouille.b64 > sequence-pot-bouille.pdf
          test -s sequence-pot-bouille.pdf
          file sequence-pot-bouille.pdf
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sequence-pot-bouille.pdf
          git commit -m "Publier la séquence Pot-Bouille en PDF" || exit 0
          git push
