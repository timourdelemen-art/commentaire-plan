name: Audit global HTML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'netlify.toml'
      - 'scripts/**'
      - '.github/workflows/audit-global-html.yml'
  pull_request:
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'netlify.toml'
      - 'scripts/**'
      - '.github/workflows/audit-global-html.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Générer les pages
        run: |
          node scripts/build-hlp.js
          node scripts/build-philo-annales.js
          node scripts/build-philo-notions.js
          node scripts/build-philo-boussole.js
          node scripts/build-capture.js
          node scripts/build-typo.js
          node scripts/seo-build.js
      - name: Contrôler les pages
        run: |
          node scripts/check-philo-parcours.js
          node scripts/check-global-pages.js
          node scripts/seo-audit.js
          node scripts/performance-budget.js
      - name: Archiver les rapports, y compris si des contrôles échouent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-audit-html
          if-no-files-found: warn
          retention-days: 30
          path: |
            controle-global-report.md
            controle-global-report.json
            seo-report.md
            performance-report.md
