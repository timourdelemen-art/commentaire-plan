name: Audit global HTML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'netlify.toml'
      - 'scripts/**'
      - '.github/workflows/audit-global-html.yml'
  pull_request:
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'netlify.toml'
      - 'scripts/**'
      - '.github/workflows/audit-global-html.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construire et contrôler le site complet
        run: eval "$(sed -n 's/^ *command = "\(.*\)"/\1/p' netlify.toml)"
      - name: Archiver les rapports, y compris si des contrôles échouent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-audit-html
          if-no-files-found: warn
          retention-days: 30
          path: |
            controle-global-report.md
            controle-global-report.json
            seo-report.md
            performance-report.md
